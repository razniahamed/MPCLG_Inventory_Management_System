openapi: 3.0.3
info:
  title: 'MPCLG Inventory & Asset Management API (v1)'
  description: 'API-first backend for the Ministry inventory and asset management system. Every protected endpoint requires exactly one permission code; see MPCLG_Inventory_System_Blueprint.md.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a token from <code>POST /api/v1/auth/login</code> and send it as <code>Authorization: Bearer {token}</code>. Tokens expire after 8 hours by default.'
security:
  -
    default: []
paths:
  /api/v1/health:
    get:
      summary: 'Service health check (public).'
      operationId: serviceHealthCheckpublic
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Service is running.'
                  data:
                    status: ok
                    database: ok
                    version: v1
                    time: '2026-11-17T08:34:42+00:00'
                  meta:
                    request_id: 01M7MA9RGRF9APY8RF48FW3RQ4
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Service is running.'
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      database:
                        type: string
                        example: ok
                      version:
                        type: string
                        example: v1
                      time:
                        type: string
                        example: '2026-11-17T08:34:42+00:00'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 01M7MA9RGRF9APY8RF48FW3RQ4
      tags:
        - Endpoints
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Sign in with username (or email) and password. Returns a bearer token.'
      operationId: signInWithUsernameorEmailAndPasswordReturnsABearerToken
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Invalid username or password.'
                  code: UNAUTHENTICATED
                  meta:
                    request_id: 01M7MA9RJXS9NQZVG4TEPT1ME3
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid username or password.'
                  code:
                    type: string
                    example: UNAUTHENTICATED
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 01M7MA9RJXS9NQZVG4TEPT1ME3
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 'Must not be greater than 190 characters.'
                  example: b
                password:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: ']|{+-0pBNvYg'
                device_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: h
                  nullable: true
              required:
                - username
                - password
      security: []
  /api/v1/auth/forgot-password:
    post:
      summary: ''
      operationId: postApiV1AuthForgotPassword
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'If the address belongs to an active account, a reset link has been sent.'
                  data: null
                  meta:
                    request_id: 01M7MA9RPKF0SNTNK65JZZTF3X
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'If the address belongs to an active account, a reset link has been sent.'
                  data:
                    type: string
                    example: null
                    nullable: true
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 01M7MA9RPKF0SNTNK65JZZTF3X
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 190 characters.'
                  example: gbailey@example.net
              required:
                - email
      security: []
  /api/v1/auth/reset-password:
    post:
      summary: ''
      operationId: postApiV1AuthResetPassword
      description: ''
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation failed.'
                  code: VALIDATION_ERROR
                  errors:
                    password:
                      - 'The password field confirmation does not match.'
                      - 'The password field must be at least 10 characters.'
                      - 'The password field must contain at least one uppercase and one lowercase letter.'
                      - 'The password field must contain at least one letter.'
                      - 'The password field must contain at least one number.'
                  meta:
                    request_id: 01M7MA9RR7MZE2V5YPQ7BF8NPY
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation failed.'
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  errors:
                    type: object
                    properties:
                      password:
                        type: array
                        example:
                          - 'The password field confirmation does not match.'
                          - 'The password field must be at least 10 characters.'
                          - 'The password field must contain at least one uppercase and one lowercase letter.'
                          - 'The password field must contain at least one letter.'
                          - 'The password field must contain at least one number.'
                        items:
                          type: string
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 01M7MA9RR7MZE2V5YPQ7BF8NPY
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 190 characters.'
                  example: gbailey@example.net
                token:
                  type: string
                  description: ''
                  example: architecto
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - email
                - token
                - password
      security: []
