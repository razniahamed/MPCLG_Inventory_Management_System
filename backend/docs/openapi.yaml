      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 'Must match the regex /^[A-Za-z0-9._-]+$/. Must be at least 3 characters. Must not be greater than 60 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 190 characters.'
                  example: zbailey@example.net
                officer_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                  nullable: true
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                  nullable: true
                roles:
                  type: array
                  description: ''
                  example: null
                  items:
                    type: object
                    nullable: true
                    properties:
                      role:
                        type: string
                        description: 'Must match an existing stored value.'
                        example: architecto
                      scope_type:
                        type: string
                        description: ''
                        example: division
                        enum:
                          - global
                          - division
                          - department
                          - store
                        nullable: true
                      scope_id:
                        type: integer
                        description: ''
                        example: 16
                        nullable: true
                      valid_from:
                        type: string
                        description: 'Must be a valid date.'
                        example: '2026-11-17T08:34:42'
                        nullable: true
                      valid_to:
                        type: string
                        description: 'Must be a valid date. Must be a date after <code>now</code>.'
                        example: '2052-12-10'
                        nullable: true
                    required:
                      - role
                reason:
                  type: string
                  description: 'Must be at least 3 characters. Must not be greater than 255 characters.'
                  example: v
                  nullable: true
              required:
                - username
                - email
